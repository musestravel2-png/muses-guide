<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F9F9F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111015" media="(prefers-color-scheme: dark)">
<title>Muses · Villa Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600&family=Noto+Serif+Display:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Muses Villa Guide · μία στήλη για κινητό (έως 600px), κάρτες μόνο για ό,τι πατάει ο επισκέπτης.
   Σειρά: φωτογραφία → καλωσόρισμα → γρήγορες κινήσεις → καιρός → έκτακτα → ενότητες. */
:root{
  --paper:#F9F9F8; --card:#FFFFFF; --ink:#1C1917; --muted:#6B645B; --line:#E6E4DF; --soft:#F2F1EE;
  --accent:#241E5A; --accent-soft:#EEEDF6; --on-accent:#FFFFFF; --ok:#2F6B4F; --warn-bg:#FDF4E7; --warn:#8A5A12;
  --sos:#B42318; --sos-bg:#FEF3F2; --sos-line:#F7CFCB; --sun:#E9A21B;
  --display:"Noto Serif Display", Didot, Georgia, serif;
  --body:"Commissioner", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:16px; --gut:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --paper:#111015; --card:#1A1920; --ink:#ECEAE5; --muted:#A29C93; --line:#2D2B35; --soft:#22212A;
  --accent:#B8B2F5; --accent-soft:#25223E; --on-accent:#15122E; --ok:#7CC4A0; --warn-bg:#2E2614; --warn:#E6C27A;
  --sos:#FF8A80; --sos-bg:#2A1617; --sos-line:#4A2427; --sun:#F2C14E; color-scheme:dark } }
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:600px;margin:0 auto;padding:0 var(--gut) calc(112px + env(safe-area-inset-bottom,0px))}

/* Πάνω μπάρα: ενότητες + γλώσσα, πάντα ορατή */
.bar{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:0 0 0 var(--gut);height:52px}
.toc{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:24px}
.toc::-webkit-scrollbar{display:none}
.toc a{flex:none;display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;text-decoration:none;font-size:14px;color:var(--muted);white-space:nowrap}
.toc a.on{background:var(--ink);color:var(--paper)}
.toc a.sos{color:var(--sos)}
.toc a.sos.on{background:var(--sos);color:#fff}
.lang{flex:none;position:relative;margin-right:var(--gut);height:36px;min-width:60px;display:inline-flex;align-items:center;padding:0 26px 0 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:13.5px;font-weight:600;letter-spacing:.04em}
.lang::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.lang select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}

.banner{margin:12px 0 0;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px}

/* Φωτογραφία με τίτλο πάνω της */
.hero{margin-top:14px;border-radius:20px;overflow:hidden;position:relative;background:#8FA9C4;aspect-ratio:4/3;max-height:46vh;width:100%}
@media (min-width:480px){.hero{aspect-ratio:16/10}}
.hero > img,.hero > svg{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 38%,rgba(10,8,25,.72) 100%)}
.hero .cap{position:absolute;left:18px;right:18px;bottom:16px;z-index:1;color:#fff}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;margin:0 0 4px;opacity:.9}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,8.5vw,2.9rem);line-height:1.04;margin:0;text-wrap:balance}
.hero .area{margin:6px 0 0;font-size:14.5px;opacity:.92}
.facts-line{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 2px 0;color:var(--muted);font-size:14px}
.facts-line b{color:var(--ink);font-weight:600}

/* Καλωσόρισμα επισκέπτη */
.me{margin-top:14px;background:var(--accent);color:var(--on-accent);border-radius:var(--r);padding:16px 18px}
.me h2{font-family:var(--display);font-weight:400;font-size:1.55rem;margin:0 0 10px;line-height:1.15}
.me dl{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin:0}
.me dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.me dd{margin:0;font-weight:500}

/* Κουπόνι */
.coupon{margin-top:14px;border:1.5px dashed var(--accent);border-radius:var(--r);background:var(--accent-soft);padding:16px 18px;display:grid;gap:6px}
.coupon .eb{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.coupon h2{font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1.1;margin:0}
.coupon p{margin:0;font-size:14.5px}
.coupon .cc{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:6px}
.coupon .v{font-family:var(--mono);font-size:18px;letter-spacing:.14em;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;user-select:all}
.coupon a.go{background:var(--accent);color:var(--on-accent);text-decoration:none;border-radius:999px;min-height:44px;display:inline-flex;align-items:center;padding:0 18px;font-weight:500;font-size:14.5px}
.coupon small{color:var(--muted);font-size:12.5px}

/* Γρήγορες κινήσεις */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.tiles.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:88px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-decoration:none;cursor:pointer;text-align:left;min-width:0}
.tile svg{width:24px;height:24px;flex:none}
.tile b{display:block;font-weight:600;font-size:14.5px;line-height:1.2}
.tile small{display:block;color:var(--muted);font-size:12.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tile.primary small{color:inherit;opacity:.8}
.tile.sos{border-color:var(--sos-line);background:var(--sos-bg);color:var(--sos)}
.tile.sos small{color:inherit;opacity:.85}
@media (max-width:359px){.tiles,.tiles.c3{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Καιρός */
.wx{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 12px}
.wx .now{display:flex;align-items:center;gap:14px}
.wx .now svg{width:54px;height:54px;flex:none}
.wx .t{font-family:var(--display);font-size:3.2rem;line-height:.9;font-weight:400}
.wx .d{min-width:0}
.wx .d b{display:block;font-weight:600;font-size:16px}
.wx .d > span{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:13.5px;line-height:1.45}
.wx .d .wind svg{width:14px;height:14px}
.wx .lbl{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.days{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(52px,1fr);gap:4px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{text-align:center;font-size:13px;line-height:1.3}
.day i{display:block;font-style:normal;color:var(--muted);font-size:12px;text-transform:capitalize}
.day svg{width:28px;height:28px;display:block;margin:4px auto}
.day b{font-weight:600}
.day span{color:var(--muted)}
.wx .src{display:block;text-align:right;font-size:10.5px;color:var(--muted);margin-top:8px}
.wx .src a{color:inherit}

/* Έκτακτη ανάγκη */
.sosc{margin-top:14px;border:1px solid var(--sos-line);background:var(--sos-bg);border-radius:var(--r);padding:14px;scroll-margin-top:68px}
.sosc h2{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px;font-weight:600;color:var(--sos);letter-spacing:.02em}
.sosc h2 svg{width:20px;height:20px}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.num{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;min-height:64px;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--sos-line);text-decoration:none;min-width:0}
.num b{font-size:1.45rem;font-weight:600;color:var(--sos);font-variant-numeric:tabular-nums;line-height:1}
.num span{font-size:12.5px;line-height:1.2;color:var(--ink);min-width:0;max-width:100%;overflow-wrap:anywhere;hyphens:auto}
.num.wide{flex-direction:row;align-items:center;gap:12px;min-height:56px}
.num.wide{grid-column:1 / -1;background:var(--sos);border-color:var(--sos)}
.num.wide b,.num.wide span{color:#fff}
.hosp{margin-top:8px;background:var(--card);border:1px solid var(--sos-line);border-radius:12px;padding:12px}
.hosp .k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sos);font-weight:600}
.hosp .n{font-weight:600;margin:2px 0 0}
.hosp .m{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.acts2{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);text-decoration:none;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.red{background:var(--sos);color:#fff;border-color:var(--sos)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.sosc details{margin-top:8px;border:0;background:var(--card);border-radius:12px;border:1px solid var(--sos-line)}
.sosc summary{padding:12px 14px;font-weight:500;font-size:14.5px}
.care{padding:0 14px 6px}
.care .it{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.care .it.first{border-top:0;padding-top:6px}
.care .it small.tip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.care .it .acts2{margin-top:8px}
.care .it > div{flex:1;min-width:0}
.care .it b{display:block;font-weight:500;font-size:14.5px;line-height:1.3}
.care .it small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.care .it .ico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sos-bg);color:var(--sos);flex:none}
.care .it .ico svg{width:17px;height:17px}
.care .it .acts{display:flex;gap:6px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);text-decoration:none;flex:none}
.iconbtn svg{width:18px;height:18px}
.duty{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 8px;border-top:1px solid var(--line);font-size:14px;text-decoration:none}
.duty small{display:block;color:var(--muted);font-size:12.5px}

/* Ενότητες */
section{padding:28px 0 4px;scroll-margin-top:60px}
section + section{border-top:1px solid var(--line);margin-top:24px}
h2.s{font-family:var(--display);font-weight:400;font-size:1.75rem;line-height:1.1;margin:0 0 14px}
h3{font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:20px 0 8px}
p{margin:0 0 10px;max-width:65ch}
.addr{font-weight:500}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
.photos a{display:block;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--line)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.pdf{margin:6px 6px 0 0;border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:44px;padding:0 12px;font-size:13.5px;display:inline-flex;gap:8px;align-items:center;text-decoration:none}
.pdf::before{content:"PDF";font-size:10px;font-weight:600;letter-spacing:.06em;background:var(--accent);color:var(--on-accent);border-radius:4px;padding:2px 5px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.row + .row{border-top:1px solid var(--line)}
.row > div{min-width:0}
.row .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row .v{font-family:var(--mono);font-size:17px;word-break:break-all;user-select:all}
.copy,.small-btn{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;min-height:40px;padding:0 14px;font-size:13.5px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.copy.done{color:var(--ok);border-color:var(--ok)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact b{display:block;font-family:var(--display);font-weight:400;font-size:2rem;line-height:1}
.fact span{font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:13px;border-radius:999px;padding:4px 11px;background:var(--accent-soft)}
details{border-top:1px solid var(--line)}
section details:last-of-type{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;min-height:48px;padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:500}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:20px;color:var(--muted);line-height:1;transition:transform .2s;flex:none}
details[open] summary::after{transform:rotate(45deg)}
details .body{padding-bottom:14px}
ul.list{list-style:none;padding:0;margin:0}
ul.list li{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:12px}
ul.list li:last-child{border-bottom:1px solid var(--line)}
ul.list li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:.6em}
ol.steps{padding:0;margin:0;list-style:none;counter-reset:s;display:grid;gap:10px}
ol.steps li{counter-increment:s;display:flex;gap:12px;align-items:baseline}
ol.steps li::before{content:counter(s);font-family:var(--display);font-size:1.4rem;line-height:1;color:var(--accent);min-width:1ch}

/* Γύρω σας: φίλτρα + κάρτες που σύρονται οριζόντια */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gut));padding:2px var(--gut) 12px}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;min-height:40px;padding:0 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.filters button svg{width:16px;height:16px}
.filters button small{color:var(--muted);font-size:12px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filters button[aria-pressed="true"] small{color:inherit;opacity:.7}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:min(80%,300px);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 var(--gut);margin:0 calc(-1 * var(--gut));padding:2px var(--gut) 8px;scrollbar-width:none;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.card{scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .top{position:relative;height:64px;display:grid;place-items:center;background:var(--soft);color:var(--muted)}
.card .top svg{width:30px;height:30px;opacity:.75}
.card .top.ph{height:150px}
.card .top img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:10px;left:10px;z-index:1;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:4px 9px}
.dist{position:absolute;top:10px;right:10px;z-index:1;font-size:12px;font-weight:500;background:color-mix(in srgb,var(--card) 92%,transparent);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums}
.card .in{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h4{margin:0;font-size:16px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:12.5px;color:var(--muted)}
.card p{margin:2px 0 0;font-size:14px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .acts2{margin-top:auto;padding-top:10px}
.card .price{font-size:13px;color:var(--muted)}
.card .price b{color:var(--ink);font-size:15px}
.hint{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin:2px 0 0}
.dots{display:flex;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}

.co{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.co b{font-family:var(--display);font-weight:400;font-size:2.6rem;line-height:1}
.late{margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.late a{font-size:14px;font-weight:500}
.share{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qr{background:#fff;padding:10px;border-radius:12px;border:1px solid var(--line);width:132px;height:132px;flex:none}
.qr img,.qr canvas{width:112px!important;height:112px!important;display:block}
.share > div{min-width:0;flex:1 1 200px}
.url{font-family:var(--mono);font-size:13px;word-break:break-all;color:var(--muted);margin-bottom:8px}
footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:grid;gap:4px}
footer strong{font-family:var(--display);font-weight:400;font-size:1.2rem;color:var(--ink)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;display:inline-flex;gap:8px;align-items:center;min-height:48px;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:500;border-radius:999px;padding:0 18px;box-shadow:0 6px 24px rgba(20,16,50,.28)}
.fab svg{width:20px;height:20px}
@media (max-width:479px){.fab{width:56px;height:56px;padding:0;justify-content:center}.fab span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.fab svg{width:24px;height:24px}}
dialog{border:0;border-radius:18px;padding:0;width:min(440px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(15,12,30,.5)}
dialog form{padding:20px;display:grid;gap:12px}
dialog h4{margin:0;font-family:var(--display);font-weight:400;font-size:1.5rem}
dialog label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
dialog input,dialog textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);font-size:16px;width:100%;min-height:44px}
dialog .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
dialog .acts button{border-radius:999px;min-height:44px;padding:0 18px;border:1px solid var(--line);background:transparent;cursor:pointer}
dialog .acts button.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:500}
dialog .err{color:var(--sos);font-size:13.5px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;z-index:9;max-width:calc(100vw - 32px)}
.state{min-height:70vh;display:grid;place-items:center;text-align:center;padding:24px 16px}
.state h1{font-size:2rem;margin-bottom:10px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media (max-width:380px){.photos{grid-template-columns:repeat(2,minmax(0,1fr))}.fact b{font-size:1.7rem}.wx .t{font-size:2.8rem}}
@media (max-width:359px){:root{--gut:12px}.tile{padding:10px}.num b{font-size:1.25rem}}
</style>

}

/* Ενεργή ενότητα στην πάνω μπάρα */
function watchSections(){
  if (watchSections._o) watchSections._o.disconnect();
  if (!("IntersectionObserver" in window)) return;
  const links = [...document.querySelectorAll(".toc a")];
  const o = new IntersectionObserver(es => {
    es.forEach(e => { if (!e.isIntersecting) return;
      links.forEach(a => a.classList.toggle("on", a.dataset.sec === e.target.id));
      const a = links.find(x => x.dataset.sec === e.target.id); if (a && a.scrollIntoView) { const n = a.parentElement; n.scrollTo({ left: a.offsetLeft - 16, behavior: "smooth" }); } });
  }, { rootMargin: "-45% 0px -50% 0px" });
  links.forEach(a => { const s = document.getElementById(a.dataset.sec); if (s) o.observe(s); });
  watchSections._o = o;
}

    if (!guestMode && !name) return showErr(t.errName);
    go.disabled = true; go.textContent = t.sending; err.hidden = true;
    const body = { v: SLUG, k: guestMode ? KEY.k : "", service: e.id, date: $("#rq-date").value, persons: $("#rq-n").value, email: email, name: name,
                   phone: $("#rq-phone") ? $("#rq-phone").value.trim() : "", note: $("#rq-note").value.trim(), lang: lang };
    try {
      const r = await fetch("/api/request", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const j = await r.json();
      if (!j.ok) return showErr(j.code === "EMAIL" ? t.errEmail : (j.code === "NAME" ? t.errName : t.errGen));
      f.innerHTML = `<h4>${esc(t.sentT)}</h4><p>${esc(t.sentB)}</p><div class="acts"><button class="go" type="button" id="rq-x2">${esc(t.close)}</button></div>`;
      $("#rq-x2").onclick = () => $("#dlg").close();
    } catch (x) { showErr(t.errGen); }
  };
  const d = $("#dlg"); if (d.showModal) d.showModal(); else d.setAttribute("open", "");
}

/* ---------- Συμβάντα ---------- */
document.addEventListener("click", e => {
  const c = e.target.closest("[data-copy]"); if (c) { copy(c.dataset.copy, c); return; }
  const w = e.target.closest("[data-wifi]"); if (w && D && D.arrival && D.arrival.wifi) { copy(D.arrival.wifi.pass, w, T().wifiCopied + (D.arrival.wifi.net ? " · " + D.arrival.wifi.net : "")); return; }
  const f = e.target.closest("[data-f]"); if (f) { filter = f.dataset.f; renderNearby(); const r = $("#rail"); if (r) r.scrollLeft = 0; return; }
  const x = e.target.closest("[data-exp]"); if (x) { openRequest(+x.dataset.exp); return; }
});
document.addEventListener("change", e => {
  if (e.target && e.target.id === "lang") { lang = e.target.value; store.set("muses-guide-lang", lang); filter = ""; load(); }
});
load();
</script>
